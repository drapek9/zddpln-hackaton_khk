[project]
name = "cesty-backend"
version = "0.1.0"
description = "Backend a logika pro Cesty KHK"
requires-python = ">=3.12"
license = "EUPL-1.2"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "networkx>=3.3",
    "sqlmodel>=0.0.48",
    "pyjwt>=2.15.1",
    "pywebpush>=2.5.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# Repo can live in OneDrive/iCloud, which breaks hardlinks.
link-mode = "copy"
